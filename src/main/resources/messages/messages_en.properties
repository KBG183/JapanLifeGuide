policy.eyebrow=Service information
policy.privacy.title=Privacy notice
policy.privacy.intro=This personal project provides living and administrative guidance. We use only information needed to provide the service.
policy.privacy.collectionTitle=Information collected
policy.privacy.collection=When you register, we store your login ID, display name, email address, password hash, and the preparation lists, events, and community posts you save or create.
policy.privacy.useTitle=How we use it
policy.privacy.use=We use this information for login, email verification, password reset, preparation tracking, and community features.
policy.privacy.storageTitle=Storage and sharing
policy.privacy.storage=This is not an official government service. We do not sell or share stored information for advertising. Passwords are not stored in plain text.
policy.privacy.deleteTitle=Deletion
policy.privacy.delete=Account self-deletion is not currently implemented. Contact the service administrator if deletion is needed.
policy.terms.title=Terms of use
policy.terms.intro=By using this service, you agree to the following terms.
policy.terms.serviceTitle=Service scope
policy.terms.service=We provide procedure summaries, official links, personal preparation management, and community features. We do not accept applications or make individual administrative decisions.
policy.terms.userTitle=User responsibility
policy.terms.user=Always confirm current requirements, deadlines, and documents with the responsible authority. Do not share your account information.
policy.terms.contentTitle=Changes to the service
policy.terms.content=Because this is a personal project, content or features may change or stop without prior notice.
policy.community.title=Community rules
policy.community.intro=These basic rules help people share information about life in Japan safely.
policy.community.goodTitle=Please do
policy.community.good=Respect others and distinguish personal experience from official information. Do not publish personal information or contact details.
policy.community.prohibitedTitle=Prohibited content
policy.community.prohibited=Illegal activity, harassment, discrimination, impersonation, spam, misinformation, and publishing another person’s personal information are prohibited.
policy.community.actionTitle=Moderation
policy.community.action=Posts and comments that violate these rules may be hidden or deleted after a report or at the administrator’s discretion.
