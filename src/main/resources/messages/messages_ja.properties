policy.privacy.title=プライバシー案内
policy.privacy.intro=個人プロジェクトとして運営する生活行政案内サービスです。必要な情報だけをサービス提供のために使用します。
policy.privacy.collectionTitle=収集する情報
policy.privacy.collection=アカウント作成時のログインID、表示名、メールアドレス、パスワードのハッシュ値と、ユーザーが保存した準備リスト・予定・コミュニティ投稿を保存します。
policy.privacy.useTitle=利用目的
policy.privacy.use=ログイン、メール認証、パスワード再設定、準備状況の保存、コミュニティ機能の提供に使用します。
policy.privacy.storageTitle=保存と共有
policy.privacy.storage=このサービスは行政機関の公式サービスではありません。保存した情報を広告目的で販売・共有しません。認証情報は平文のパスワードとして保存しません。
policy.privacy.deleteTitle=削除について
policy.privacy.delete=現在、画面からの会員退会機能は実装していません。削除が必要な場合はサービス管理者に連絡してください。
policy.terms.title=利用規約
policy.terms.intro=このサービスを利用することで、以下の内容に同意したものとします。
policy.terms.serviceTitle=サービスの範囲
policy.terms.service=行政手続の概要、公式情報へのリンク、個人用準備管理、コミュニティ機能を提供します。申請の受付や個別の行政判断は行いません。
policy.terms.userTitle=利用者の責任
policy.terms.user=最新の条件、期限、必要書類は必ず担当機関の公式案内で確認してください。アカウント情報を他人に共有しないでください。
policy.terms.contentTitle=サービスの変更
policy.terms.content=個人プロジェクトのため、予告なく内容や機能を変更・停止する場合があります。
policy.community.title=コミュニティ利用ルール
policy.community.intro=日本での生活情報を安全に共有するための基本ルールです。
policy.community.goodTitle=お願いしたいこと
policy.community.good=相手を尊重し、経験談と公式情報を区別して投稿してください。個人情報や連絡先は公開しないでください。
policy.community.prohibitedTitle=禁止事項
policy.community.prohibited=違法行為、嫌がらせ、差別、なりすまし、スパム、虚偽情報の拡散、他人の個人情報の掲載を禁止します。
policy.community.actionTitle=管理対応
policy.community.action=ルール違反の投稿やコメントは、通報受付後または管理者の判断で非表示・削除される場合があります。
