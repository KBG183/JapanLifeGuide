policy.privacy.title=개인정보 안내
policy.privacy.intro=이 서비스는 개인 프로젝트로 운영되는 생활행정 안내 서비스입니다. 서비스 제공에 필요한 정보만 사용합니다.
policy.privacy.collectionTitle=수집하는 정보
policy.privacy.collection=회원가입 시 로그인 ID, 표시 이름, 이메일, 비밀번호 해시와 사용자가 저장한 준비 목록·일정·커뮤니티 게시글을 저장합니다.
policy.privacy.useTitle=이용 목적
policy.privacy.use=로그인, 이메일 인증, 비밀번호 재설정, 준비 상태 저장, 커뮤니티 기능 제공에 사용합니다.
policy.privacy.storageTitle=보관과 공유
policy.privacy.storage=이 서비스는 행정기관의 공식 서비스가 아닙니다. 저장한 정보를 광고 목적으로 판매하거나 공유하지 않습니다. 비밀번호는 평문으로 저장하지 않습니다.
policy.privacy.deleteTitle=삭제 안내
policy.privacy.delete=현재 화면에서 회원 탈퇴하는 기능은 구현되어 있지 않습니다. 삭제가 필요하면 서비스 관리자에게 문의해 주세요.
policy.terms.title=이용약관
policy.terms.intro=이 서비스를 이용하면 다음 내용에 동의한 것으로 봅니다.
policy.terms.serviceTitle=서비스 범위
policy.terms.service=행정 절차 요약, 공식 정보 링크, 개인 준비 관리, 커뮤니티 기능을 제공합니다. 신청 접수나 개별 행정 판단은 하지 않습니다.
policy.terms.userTitle=이용자 책임
policy.terms.user=최신 조건·기한·필요 서류는 반드시 담당 기관의 공식 안내에서 확인해 주세요. 계정 정보를 다른 사람과 공유하지 마세요.
policy.terms.contentTitle=서비스 변경
policy.terms.content=개인 프로젝트이므로 별도 예고 없이 내용이나 기능이 변경·중단될 수 있습니다.
policy.community.title=커뮤니티 운영 규칙
policy.community.intro=일본 생활 정보를 안전하게 나누기 위한 기본 규칙입니다.
policy.community.goodTitle=지켜 주세요
policy.community.good=서로 존중하고, 개인 경험과 공식 정보를 구분해 작성해 주세요. 개인정보와 연락처를 공개하지 마세요.
policy.community.prohibitedTitle=금지 사항
policy.community.prohibited=불법 행위, 괴롭힘, 차별, 사칭, 스팸, 허위 정보 유포, 타인의 개인정보 게시를 금지합니다.
policy.community.actionTitle=관리 조치
policy.community.action=규칙 위반 게시글과 댓글은 신고 접수 또는 관리자 판단에 따라 숨김·삭제될 수 있습니다.
