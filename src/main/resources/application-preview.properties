spring.datasource.url=jdbc:h2:mem:japanlife;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:db/01_create_tables.sql
spring.sql.init.data-locations=classpath:db/02_sample_data.sql,classpath:db/04_seed_translation_data.sql,classpath:db/07_update_document_guidance.sql,classpath:db/08_add_resident_procedures.sql,classpath:db/09_review_resident_procedure_documents.sql,classpath:db/16_preview_life_procedures.sql
spring.sql.init.continue-on-error=false
app.preview=true
