spring.application.name=japan-life-guide
# 기본을 실제 로컬 Oracle(solo)로 연결합니다.
spring.profiles.default=oracle
server.address=127.0.0.1
server.port=${APP_PORT:8082}
logging.file.name=logs/japan-life-guide.log
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
spring.sql.init.mode=never
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB
app.mail.verification-expiry-minutes=${MAIL_VERIFICATION_EXPIRY_MINUTES:10}
app.mail.resend-cooldown-seconds=${MAIL_RESEND_COOLDOWN_SECONDS:60}
app.mail.from=${MAIL_FROM:}
